<!DOCTYPE html>

<html class="dark" lang="en"><head>

<style>
      .glass-effect {
        background: rgba(32, 32, 31, 0.4);
        backdrop-filter: blur(20px);
      }
      .neon-glow {
        filter: drop-shadow(0 0 15px rgba(29, 185, 84, 0.4));
      }
      body {
        min-height: 100dvh;
      }
      .spotify-shadow {
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      }
    </style>
</head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col items-center justify-center p-0 m-0 overflow-hidden">
<!-- Instagram Story Wrapper (9:16 aspect ratio) -->
<div class="relative w-full h-full max-w-[450px] aspect-[9/16] bg-surface overflow-hidden flex flex-col shadow-2xl">
<!-- Background Layer -->
<div class="absolute inset-0 z-0 bg-gradient-to-b from-surface-container-low via-background to-background"></div>
<!-- Header -->
<header class="relative z-10 flex flex-col items-center pt-8 pb-4">
<h2 class="font-headline font-extrabold text-primary italic text-3xl tracking-tighter uppercase leading-tight">DNA REPORT</h2>
<p class="font-label text-on-surface-variant text-[0.6rem] tracking-[0.2em] mt-1 opacity-50 uppercase">Session • 05.24.2024</p>
</header>
<!-- Main Content -->
<main class="relative z-10 flex-1 flex flex-col px-6 pb-24">
<!-- Artist Section -->
<div class="w-full mb-8">
<div class="relative w-full aspect-[4/3] rounded-xl overflow-hidden spotify-shadow">
<img alt="The Weeknd Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDthpWFavIyBkMxJbCSHoN149BI1D-JRSt5wnCSvzPpxicxCeG7fI3X7Uovxvm6i2FbyZCFZhyrc8jZdEJz4C3lxVmw5lKfWmCaveGUTLxhKPqmxVrld4WSCu81CZRyYIERS3rRSkEql1fvSdp_dS7YIIolIwIPGuWFe9Gh7jzfFvy5-nQ7yoFOoPoUuB0YgjG9MzLCDqdXLvbULdbRnjFweM_zeOxGmLVg9M_tczPRXDDxMcyK_YXKNcRxdUyD-GkJSyLFze_NmdY"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
<div class="absolute bottom-4 left-4">
<div class="inline-block px-2 py-0.5 bg-primary rounded-sm">
<span class="text-[0.6rem] font-extrabold text-black uppercase tracking-wider">DNA VERIFIED</span>
</div>
</div>
</div>
<div class="mt-4">
<h1 class="font-headline font-extrabold text-white text-3xl tracking-tighter uppercase leading-tight text-center">THE WEEKND</h1>
</div>
</div>
<!-- Stats Grid -->
<div class="grid grid-cols-2 gap-4 flex-1 mb-6">
<!-- Accuracy -->
<div class="bg-surface-container-low border border-white/5 rounded-2xl p-4 flex flex-col justify-center items-center">
<span class="font-label text-on-surface-variant text-[0.6rem] uppercase tracking-[0.2em] mb-2">Accuracy</span>
<div class="flex items-baseline">
<span class="font-headline font-extrabold text-4xl text-white tracking-tighter">98</span>
<span class="font-headline font-extrabold text-primary text-xl ml-0.5">%</span>
</div>
</div>
<!-- Performance Class -->
<div class="bg-surface-container-low border border-white/5 rounded-2xl p-4 flex flex-col justify-center items-center">
<span class="font-label text-on-surface-variant text-[0.6rem] uppercase tracking-[0.2em] mb-2">Class</span>
<span class="font-headline font-extrabold text-2xl text-primary tracking-tighter">ELITE</span>
</div>
<!-- Average Reflex -->
<div class="bg-surface-container-low border border-white/5 rounded-2xl p-4 flex flex-col justify-center items-center">
<span class="font-label text-on-surface-variant text-[0.6rem] uppercase tracking-[0.2em] mb-2">Avg. Reflex</span>
<div class="flex items-baseline">
<span class="font-headline font-extrabold text-4xl text-white tracking-tighter">0.4</span>
<span class="font-headline font-bold text-primary text-xs ml-1 tracking-widest uppercase">SEC</span>
</div>
</div>
<!-- Global Rank -->
<div class="bg-surface-container-low border border-white/5 rounded-2xl p-4 flex flex-col justify-center items-center text-center">
<span class="font-label text-on-surface-variant text-[0.6rem] uppercase tracking-[0.2em] mb-2">Global Rank</span>
<span class="font-headline font-extrabold text-xl text-white tracking-tight">TOP 1.2%</span>
</div>
</div>
<!-- Footer Buttons -->
<div class="space-y-4">
<button class="w-full bg-primary text-black font-headline font-extrabold py-4 rounded-xl flex items-center justify-center gap-2 active:scale-[0.98] transition-all shadow-[0_12px_24px_-8px_rgba(29,185,84,0.3)]">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">share</span>
<span class="tracking-tight uppercase">Share To Story</span>
</button>
<div class="text-center opacity-40">
<span class="font-label text-[0.55rem] text-on-surface-variant uppercase tracking-[0.3em]">sonicpulse.io</span>
</div>
</div>
</main>
<!-- Navigation Bar -->
<nav class="fixed bottom-6 left-0 right-0 mx-auto w-[90%] flex justify-around items-center h-16 z-50 bg-[#121212]/90 backdrop-blur-2xl rounded-2xl border border-white/5 shadow-2xl">
<div class="flex items-center justify-center text-[#ADAAAA] p-3 hover:text-primary transition-colors">
<span class="material-symbols-outlined">bolt</span>
</div>
<div class="flex items-center justify-center text-[#ADAAAA] p-3 hover:text-primary transition-colors">
<span class="material-symbols-outlined">search</span>
</div>
<div class="flex items-center justify-center bg-primary text-black rounded-xl p-3 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined">leaderboard</span>
</div>
<div class="flex items-center justify-center text-[#ADAAAA] p-3 hover:text-primary transition-colors">
<span class="material-symbols-outlined">person</span>
</div>
</nav>
<!-- Grain Overlay -->
<div class="absolute inset-0 pointer-events-none opacity-[0.03] mix-blend-overlay bg-[url('https://www.transparenttextures.com/patterns/asfalt-dark.png')]"></div>
</div>
</body></html>
